<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3Flex SMP viewer</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; color: #222; background: #fafafa; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 12px; color: #666; font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .bar label { font-size: 14px; }
  input[type=number] { width: 80px; }
  button, select, input { font-size: 14px; padding: 4px 8px; }
  #drop { border: 2px dashed #aaa; border-radius: 8px; padding: 24px; text-align: center; color: #666; background: #fff; margin-bottom: 12px; }
  #drop.over { border-color: #1f77b4; color: #1f77b4; }
  #main { display: none; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
  @media (max-width: 900px) { #main { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; overflow: auto; }
  table { border-collapse: collapse; font-size: 13px; width: 100%; }
  th, td { padding: 3px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid #eee; }
  th { background: #f3f3f3; position: sticky; top: 0; }
  pre { font-size: 12px; white-space: pre-wrap; margin: 0; }
  #status { color: #1a7f37; font-size: 13px; }
  #status.warn { color: #b35900; }
  details { margin-top: 12px; }
</style>
</head>
<body>
<h1>3Flex SMP viewer</h1>
<p class="sub">Reads Micromeritics 3Flex .SMP files in your browser. Files are not uploaded anywhere.</p>

<div id="drop">Drop one or more .SMP files here or <button id="pick">Choose files</button><input type="file" id="file" accept=".smp,.SMP" multiple hidden></div>

<div class="bar">
  <label>File: <select id="active"></select></label>
  <button id="remove">Remove</button>
  <button id="clear">Clear all</button>
  <button id="copy">Copy table</button>
  <label><input type="checkbox" id="headers"> with headers</label>
  <label>X: <select id="x"></select></label>
  <label>Y: <select id="y"></select></label>
  <label>Sample mass (mg): <input type="number" id="mass" step="any" min="0"></label>
  <button id="reset">Reset</button>
  <span id="status"></span>
</div>

<div id="main">
  <div class="card"><canvas id="chart"></canvas></div>
  <div class="card">
    <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
    <details><summary>Info / log</summary><pre id="info"></pre></details>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="smp.js"></script>
<script>
const $ = id => document.getElementById(id);
const COLORS = ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd", "#8c564b", "#e377c2", "#7f7f7f", "#bcbd22", "#17becf"];
// loaded files: {name, rows, info, mass (g, from file), mg (current)}
let files = [], shown = [], chart = null;

for (const c of COLS.slice(0, 3)) $("x").add(new Option(c, COLS.indexOf(c)));
for (const c of COLS.slice(3, 5)) $("y").add(new Option(c, COLS.indexOf(c)));
$("x").value = 1;
$("y").value = 4;
$("thead").innerHTML = "<tr>" + COLS.map(c => `<th>${c}</th>`).join("") + "</tr>";

function status(text, warn) {
  $("status").textContent = text;
  $("status").className = warn ? "warn" : "";
}

const fileMg = f => round(f.mass * 1000, 6);

// table, mass and info follow the selected file; the plot overlays all files
function render() {
  const cur = files[$("active").value];
  $("main").style.display = cur ? "grid" : "none";
  if (chart) chart.destroy();
  if (!cur) { shown = []; return; }

  shown = formatRows(cur.rows, cur.mass, cur.mg / 1000);
  $("tbody").innerHTML = shown.map(r => "<tr>" + r.map(v => `<td>${v}</td>`).join("") + "</tr>").join("");
  $("info").textContent = cur.info;
  status(Math.abs(cur.mg - fileMg(cur)) < 1e-9 ? "" : `Mass changed: file has ${fileMg(cur)} mg`, true);

  const xi = +$("x").value, yi = +$("y").value;
  chart = new Chart($("chart"), {
    type: "scatter",
    data: {datasets: files.map((f, i) => ({
      label: f.name,
      data: formatRows(f.rows, f.mass, f.mg / 1000).map(r => ({x: r[xi], y: r[yi]})),
      showLine: true, borderColor: COLORS[i % COLORS.length], backgroundColor: COLORS[i % COLORS.length],
    }))},
    options: {
      animation: false,
      plugins: {legend: {display: files.length > 1}, title: {display: files.length === 1, text: cur.name}},
      scales: {x: {title: {display: true, text: COLS[xi]}}, y: {title: {display: true, text: COLS[yi]}}},
    },
  });
}

function select(i) {
  $("active").innerHTML = "";
  files.forEach((f, j) => $("active").add(new Option(f.name, j)));
  if (files.length) {
    $("active").value = Math.min(i, files.length - 1);
    $("mass").value = files[$("active").value].mg;
  } else $("mass").value = "";
  status("");
  render();
}

async function load(list) {
  const errors = [];
  for (const file of list) {
    try {
      const d = parseSMP(await file.arrayBuffer());
      files.push({...d, mg: fileMg(d)});
    } catch (e) {
      errors.push(`${file.name}: ${e.message}`);
    }
  }
  select(files.length - 1);
  if (errors.length) status("Cannot read " + errors.join("; "), true);
}

$("pick").onclick = () => $("file").click();
$("file").onchange = e => { load([...e.target.files]); e.target.value = ""; };
$("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("over"); load([...e.dataTransfer.files]); };
$("active").onchange = () => select(+$("active").value);
$("remove").onclick = () => { const i = +$("active").value; files.splice(i, 1); select(i); };
$("clear").onclick = () => { files = []; select(0); };
$("mass").oninput = () => {
  const cur = files[$("active").value], mg = parseFloat($("mass").value);
  if (!cur) return;
  if (!(mg > 0)) return status("Invalid mass", true);
  cur.mg = mg;
  render();
};
$("x").onchange = $("y").onchange = render;
$("reset").onclick = () => {
  const cur = files[$("active").value];
  if (cur) { cur.mg = fileMg(cur); $("mass").value = cur.mg; render(); }
};
$("copy").onclick = async () => {
  if (!shown.length) return;
  const lines = ($("headers").checked ? [COLS] : []).concat(shown).map(r => r.join("\t"));
  await navigator.clipboard.writeText(lines.join("\n"));
  status(`Copied ${shown.length} rows`);
};
</script>
</body>
</html>
